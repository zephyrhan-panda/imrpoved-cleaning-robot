<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edf2f1">
  <meta name="description" content="PS9 清洁机器人交互式 3D 演示。房间、污渍、运动和清洁状态全部为模拟数据。">
  <title>PS9 · 清洁机器人 3D 演示</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="./" aria-label="PS9 演示首页"><span class="brand-symbol" aria-hidden="true">P<span>9</span></span><span>PS9 <span class="brand-sub">ROBOTICS</span></span></a>
      <span class="mode"><span aria-hidden="true"></span>模拟演示</span>
    </header>
    <main>
      <div class="intro"><div><p class="eyebrow">PERCEPTION → SPACE</p><h1>看见污渍，也看见清洁过程。</h1><p class="subtitle">在三维空间中探索机器人、地面与污渍分布。</p></div><div class="room-meta"><span>室内场景 01</span><strong>8 × 6 <small>m</small></strong></div></div>
      <div class="workspace">
        <section class="scene-panel" aria-label="三维清洁场景">
          <div class="scene-top"><span class="scene-title"><i aria-hidden="true"></i>空间视图</span><div class="view-buttons" aria-label="视角"><button id="perspective" class="view-button active" aria-pressed="true">透视</button><button id="top" class="view-button" aria-pressed="false">俯视</button></div></div>
          <div id="viewport" class="viewport"><div id="loading" class="loading" role="status">正在构建三维场景…</div><div id="labels" class="labels" aria-hidden="true"></div><span id="robot-label" class="robot-label" aria-hidden="true">PS9</span></div>
          <div class="scene-bottom"><span class="gesture">拖动旋转 · 滚轮缩放 · 点击污渍查看</span><div class="scene-options"><label><input id="route-toggle" type="checkbox" checked>路线</label><label><input id="labels-toggle" type="checkbox" checked>编号</label><button id="zoom-in" class="icon-button" aria-label="放大场景">＋</button><button id="zoom-out" class="icon-button" aria-label="缩小场景">−</button></div></div>
          <div class="transport"><button id="play" class="primary" disabled><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">开始清洁</span></button><button id="reset" class="secondary" disabled>重置</button><div class="transport-state"><span id="status-dot" class="status-dot"></span><span id="status" role="status" aria-live="polite">准备就绪</span></div><label class="speed-label" for="speed">播放速度<select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
        </section>
        <aside class="sidebar" aria-label="模拟场景数据">
          <section class="summary"><div class="section-heading"><h2>清洁进度</h2><span class="small-tag">模拟</span></div><div class="progress-head"><strong id="progress-value">0<span>%</span></strong><span><b id="cleaned-count">0</b> / <b id="total-count">9</b> 处已清理</span></div><progress id="progress" value="0" max="9" aria-label="模拟污渍清理进度"></progress><div class="telemetry"><div><span>模拟运行时间</span><strong id="elapsed">00:00</strong></div><div><span>模拟移动距离</span><strong><span id="distance">0.0</span> <small>m</small></strong></div></div></section>
          <section class="targets"><div class="section-heading"><h2>污渍分布</h2><button id="shuffle" class="text-button" disabled>重新布置 ↗</button></div><div class="legend"><span><i class="swatch bigdirt"></i>大块污渍</span><span><i class="swatch dirt"></i>普通污渍</span><span><i class="swatch water"></i>积水</span></div><div id="target-list" class="target-list" aria-label="选择污渍"></div></section>
          <section class="selection" id="selection" aria-live="polite"><span class="selection-caption">选中目标</span><div><strong id="selected-title">01 · 大块污渍</strong><span id="selected-status">待清理</span></div><p id="selected-position">模拟地面位置</p></section>
        </aside>
      </div>
      <footer><span><i aria-hidden="true"></i>演示中的坐标、路线与清洁结果均为模拟数据。</span><span>尚未连接相机、ROS 2 或真实机器人</span></footer>
    </main>
  </div>
  <noscript><p class="error">请启用 JavaScript 查看三维演示。</p></noscript>
  <script type="module">
    import('./app.mjs').catch(() => {
      const message = document.getElementById('loading');
      message.className = 'loading error';
      message.textContent = location.protocol === 'file:' ? '请通过本地 HTTP 服务打开此演示。启动方式见 web_demo/README.md。' : '三维场景加载失败，请刷新页面，或使用支持 WebGL 2 的浏览器。';
      document.getElementById('status').textContent = '场景未就绪';
    });
  </script>
</body>
</html>
